[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidiangpt"
version = "0.1.0"
description = "Agentic knowledge workflows over an Obsidian markdown vault"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "tiktoken",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.0"]
gemini = ["google-genai>=1.0"]
all = ["anthropic>=1.0", "openai>=1.0", "google-genai>=1.0"]
dev = ["pytest>=8", "pytest-mock>=3"]

[project.scripts]
obsidiangpt = "obsidiangpt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
